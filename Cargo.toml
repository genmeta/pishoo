[workspace]
resolver = "2"
members = ["gateway", "pishoo"]
exclude = ["xtask"]

# Share registry dependency types with the local transport workspaces.
[patch.crates-io]
dhttp = { path = "../dhttp/dhttp" }
dhttp-home = { path = "../dhttp/home" }
qtls = { path = "../dquic/qtls" }
qresolve = { path = "../dquic/qresolve" }
qbase = { path = "../dquic/qbase" }
qrecovery = { path = "../dquic/qrecovery" }
