[workspace]
resolver = "2"
members = ["gateway", "pishoo"]
exclude = ["xtask"]

# Lib installation compiles WASM inside the host. Optimize the compiler hot
# paths even in development builds, while keeping Pishoo itself debuggable.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3
