[env]
DHTTP_BOOTSTRAP_URL = "https://bootstrap.genmeta.net:20002"
DHTTP_CERT_SERVER_URL = "https://api.genmeta.net:4433"
DHTTP_H3_DNS_SERVER = "https://ddns.genmeta.net:4433"
DHTTP_MDNS_SERVICE = "_dhttp.local"
# Compatibility for the dhttp/dyns versions currently pinned in Cargo.lock.
DHTTP_STUN_SERVER = "bootstrap.genmeta.net:20002"
DHTTP_HTTP_DNS_SERVER = "https://bootstrap.genmeta.net:20002"
DHTTP_ROOT_CA = { value = "keychain/root.crt", relative = true }

[alias]
xtask = "run --manifest-path xtask/Cargo.toml --"
