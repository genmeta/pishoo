[package]
name = "dev.dhttp.net/calendar"
version = "0.1.0"
description = "支持中英文的个人日历前端"
license = "Apache-2.0"

[package.pishoo]
kind = "app"
title = "日历"
entry = "/"
changelog = "初始版本，月历、周视图、日程列表与中英文界面。"
dependencies = [{ publisher = "dev.dhttp.net", name = "calendar", version = "0.1.0" }]

[fs]
"/public" = "."

# Local source-build recipe; not part of the signed package metadata.
[build]
command = ["sh", "build.sh"]
manifest = "package-dist/wasmer.toml"
