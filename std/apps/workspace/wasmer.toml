[package]
name = "dev.dhttp.net/workspace"
version = "0.1.3"
description = "用户工作台前端"
license = "Apache-2.0"

[package.pishoo]
kind = "app"
title = "Workspace"
entry = "/"
changelog = "修复首次发送好友申请时勾选提供能力导致 400：由原生提交接口核验身份、建立联系人并写入本次明确授权，再投递申请。"
dependencies = [
  { publisher = "dev.dhttp.net", name = "profile", version = "0.1.0" },
  { publisher = "dev.dhttp.net", name = "message", version = "0.1.0" },
]

[fs]
"/public" = "."

# Local source-build recipe; not part of the signed package metadata.
[build]
command = ["sh", "build.sh"]
manifest = "package-dist/wasmer.toml"
