[package]
name = "dev.dhttp.net/workspace"
version = "0.1.4"
description = "用户工作台前端"
license = "Apache-2.0"

[package.pishoo]
kind = "app"
title = "Workspace"
entry = "/"
changelog = "统一联系人目录与申请流程，按实际请求处理 ACL 审批，接入 Message 0.1.1 消息资源接口。"
dependencies = [
  { publisher = "dev.dhttp.net", name = "profile", version = "0.1.0" },
  { publisher = "dev.dhttp.net", name = "message", version = "0.1.1" },
]

[fs]
"/public" = "."

# Local source-build recipe; not part of the signed package metadata.
[build]
command = ["sh", "build.sh"]
manifest = "package-dist/wasmer.toml"
