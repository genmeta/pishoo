[package]
name = "dev.dhttp.net/message"
version = "0.1.0"
description = "独立聊天、消息投递后端"
license = "Apache-2.0"

[package.pishoo]
kind = "lib"
title = "1v1聊天"
changelog = "初始版本，提供聊天与消息投递。"
dependencies = []

[package.pishoo.host]
private-storage = "消息、投递队列与对端权限观察"
