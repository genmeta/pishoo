[package]
name = "dev.dhttp.net/message"
version = "0.1.1"
description = "独立聊天、消息投递后端"
license = "Apache-2.0"

[package.pishoo]
kind = "lib"
title = "message"
changelog = "统一消息资源接口；保留 ACL 接收入口与所有者投递管理。"
dependencies = []

[package.pishoo.host]
private-storage = "消息、会话与投递队列"
request-identity = "核对真实发送者和主人身份"

[[module]]
name = "backend"
source = "lib.wasm"

[fs]
"/metadata" = "metadata"

# Local source-build recipe; not part of the signed package metadata.
[build]
command = ["sh", "build.sh"]
manifest = "dist/wasmer.toml"
