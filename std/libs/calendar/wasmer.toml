[package]
name = "dev.dhttp.net/calendar"
version = "0.1.0"
description = "个人日历与日程管理后端"
license = "Apache-2.0"

[package.pishoo]
kind = "lib"
title = "日历"
changelog = "初始版本，私有 SQLite 日程、全天与跨天事件，以及并发修改检查。"
dependencies = []

[package.pishoo.host]
private-storage = "在本 Lib 私有目录保存 calendar.db 日程数据库"
request-identity = "核对真实调用者与日历主人身份"

[[module]]
name = "backend"
source = "lib.wasm"

[fs]
"/metadata" = "metadata"

# Local source-build recipe; not part of the signed package metadata.
[build]
command = ["sh", "build.sh"]
manifest = "dist/wasmer.toml"
