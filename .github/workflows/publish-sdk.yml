name: Publish Pishoo SDK

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish (empty runs a dry run)
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: wit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag version
        if: env.RELEASE_TAG != ''
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("../Cargo.toml").read_text())
          package = manifest.get("package", manifest.get("workspace", {}).get("package", {}))
          expected = f"v{package['version']}"
          if sys.argv[1] != expected:
              raise SystemExit(f"release tag {sys.argv[1]} must match {expected}")
          PY
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag

      - name: Install Rust stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Test workspace
        run: cargo test --locked --workspace --all-features --all-targets -- --test-threads=1

      - name: Determine publication authentication
        if: env.RELEASE_TAG != ''
        id: registry
        env:
          HAS_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          python3 - <<'PY_AUTH'
          import os
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              "https://crates.io/api/v1/crates/pishoo-sdk",
              headers={"User-Agent": "genmeta pishoo publish workflow"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20):
                  existing = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              existing = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"existing={str(existing).lower()}\n")
              output.write(f"token_available={os.environ['HAS_PUBLISH_TOKEN']}\n")
          PY_AUTH

      - name: Authenticate to crates.io
        if: env.RELEASE_TAG != '' && steps.registry.outputs.existing == 'true' && steps.registry.outputs.token_available != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Release publishable workspace crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          API_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -n "${RELEASE_TAG}" ]]; then
            mode=publish
          else
            mode=dry-run
          fi

          # Dependencies must precede dependents for per-crate publication.
          packages=(
            pishoo-sdk
          )

          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/workspace-metadata.json"
          package_versions="$(
            PACKAGES="$(printf '%s\n' "${packages[@]}")" RUNNER_TEMP="$RUNNER_TEMP" python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "workspace-metadata.json").read_text())
          packages = [line for line in os.environ["PACKAGES"].splitlines() if line]
          by_name = {package["name"]: package for package in metadata["packages"]}
          for name in packages:
              package = by_name.get(name)
              if package is None:
                  raise SystemExit(f"failed to resolve workspace package metadata for {name}")
              if package.get("publish") == []:
                  print(f"skip {name} (publish = false)", file=sys.stderr)
                  continue
              print(f"{name}\t{package['version']}")
          PY
          )"

          packages_to_publish=()
          while IFS=$'\t' read -r crate_name crate_version; do
            [ -n "$crate_name" ] || continue
            crate_state="$(
              python3 - <<'PY' "$crate_name" "$crate_version"
          import sys
          import urllib.error
          import urllib.request

          name, version = sys.argv[1], sys.argv[2]
          headers = {"User-Agent": "genmeta pishoo publish workflow"}
          version_url = f"https://crates.io/api/v1/crates/{name}/{version}"
          version_request = urllib.request.Request(version_url, headers=headers)
          try:
              with urllib.request.urlopen(version_request, timeout=20) as response:
                  if response.status == 200:
                      print("published_version")
                  else:
                      raise SystemExit(f"unexpected crates.io status for {name} {version}: {response.status}")
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  crate_url = f"https://crates.io/api/v1/crates/{name}"
                  crate_request = urllib.request.Request(crate_url, headers=headers)
                  try:
                      with urllib.request.urlopen(crate_request, timeout=20) as response:
                          if response.status == 200:
                              print("missing_version")
                          else:
                              raise SystemExit(f"unexpected crates.io crate status for {name}: {response.status}")
                  except urllib.error.HTTPError as crate_error:
                      if crate_error.code == 404:
                          print("missing_crate")
                      else:
                          raise
              else:
                  raise
          PY
            )"

            if [[ "$crate_state" == "published_version" ]]; then
              echo "skip $crate_name $crate_version (already on crates.io)"
            elif [[ "$crate_state" == "missing_version" ]]; then
              echo "publish $crate_name $crate_version"
              packages_to_publish+=("$crate_name")
            else
              if [[ "$mode" == "publish" && -z "$API_PUBLISH_TOKEN" ]]; then
                echo "::error::$crate_name needs its first publication. Configure the CARGO_REGISTRY_TOKEN repository secret for this CI release."
                exit 1
              fi
              echo "publish $crate_name $crate_version (first release)"
              packages_to_publish+=("$crate_name")
            fi
          done <<< "$package_versions"

          if [[ "${#packages_to_publish[@]}" -eq 0 ]]; then
            echo "no workspace crates need a new crates.io release"
            exit 0
          fi

          if [[ "$mode" == "dry-run" ]]; then
            publish_args=(cargo publish --dry-run --locked)
            echo "dry-run publish packages: ${packages_to_publish[*]}"
            for package in "${packages_to_publish[@]}"; do
              publish_args+=(-p "$package")
            done
            "${publish_args[@]}"
          else
            echo "publish packages: ${packages_to_publish[*]}"
            for package in "${packages_to_publish[@]}"; do
              if [[ -n "$API_PUBLISH_TOKEN" ]]; then
                echo "publish $package using repository API token"
                CARGO_REGISTRY_TOKEN="$API_PUBLISH_TOKEN" cargo publish --locked -p "$package"
              else
                echo "publish $package using OIDC"
                cargo publish --locked -p "$package"
              fi
            done
          fi
