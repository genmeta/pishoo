name: Rust

on:
  push:
    branches: ["main", "feat/pishoo-integration"]
  pull_request:
    branches: ["main", "feat/pishoo-integration"]

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        target: [ubuntu, macos]
      fail-fast: false
    runs-on: ${{ matrix.target }}-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build
        run: cargo build --locked --verbose
      - name: Run tests
        # Limit test parallelism to 1 thread to avoid resource contention
        # GitHub runners have limited cores (ubuntu/windows=2, macos=3)
        run: cargo test --locked --workspace --verbose -- --test-threads=1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest rust nightly toolchain and rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - name: Run rustfmt
        run: cargo +nightly fmt --all -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install latest rust nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
      - name: Run doc
        run: RUSTDOCFLAGS="-D warnings" cargo +nightly doc --locked --no-deps

  msrv:
    strategy:
      matrix:
        target: [ubuntu, macos]
      fail-fast: false
    runs-on: ${{ matrix.target }}-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install msrv toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - name: Build with msrv
        run: cargo +1.94.0 build --locked --workspace --release
