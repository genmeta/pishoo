name: Rust

on:
  push:
    branches: ["main", "feat/pishoo-integration"]
  pull_request:
    branches: ["main", "feat/pishoo-integration"]

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        target: [ubuntu, macos]
      fail-fast: false
    runs-on: ${{ matrix.target }}-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build
        run: cargo build --locked --verbose
      - name: Run tests
        # Limit test parallelism to 1 thread to avoid resource contention
        # GitHub runners have limited cores (ubuntu/windows=2, macos=3)
        run: cargo test --locked --workspace --verbose -- --test-threads=1
      - name: Verify root ownership repair in isolated fixtures
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p pishoo --lib --no-run --message-format=json > target/ownership-tests.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          artifacts = [json.loads(line) for line in Path("target/ownership-tests.jsonl").read_text().splitlines()]
          binaries = [item["executable"] for item in artifacts
                      if item.get("reason") == "compiler-artifact"
                      and item.get("target", {}).get("name") == "pishoo"
                      and item.get("profile", {}).get("test")
                      and item.get("executable")]
          assert len(binaries) == 1, binaries
          binary = binaries[0]
          listed = subprocess.check_output([binary, "--list", "--ignored"], text=True)
          for test in [
              "server::tests::initialization::root_initialization_repairs_identity_directories_and_existing_packages",
              "server::tests::initialization::root_personal_home_repairs_initially_root_owned_native_resources",
              "package::tests::packages::root_package_installs_and_updates_belong_to_identity_owner",
              "sandbox::tests::execution::isolation::root_guest_error_and_cancellation_repair_actual_preopened_directory",
          ]:
              assert f"{test}: test" in listed, test
              subprocess.run(["sudo", "-n", binary, test, "--exact", "--ignored", "--test-threads=1"], check=True)
          PY

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest rust nightly toolchain and rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - name: Run rustfmt
        run: cargo +nightly fmt --all -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install latest rust nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
      - name: Run doc
        run: RUSTDOCFLAGS="-D warnings" cargo +nightly doc --locked --no-deps

  msrv:
    strategy:
      matrix:
        target: [ubuntu, macos]
      fail-fast: false
    runs-on: ${{ matrix.target }}-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install msrv toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.1
      - name: Build with msrv
        run: cargo +1.96.1 build --locked --workspace --release
