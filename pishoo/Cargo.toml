[package]
name = "pishoo"
description = "modern, secure, QUIC-powered web/proxy engine"
homepage = "https://www.dhttp.net"
version = "0.8.2"
edition = "2024"
license = "Apache-2.0"
autobins = false

[dependencies]
gateway = { path = "../gateway" }
dhttp = { path = "../../dhttp/dhttp" }
dhttp-home = { path = "../../dhttp/home" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1"
wasmparser = "0.259.0"

bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
h3x = { path = "../../h3x" }
qrecovery = "0.6.2"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "io-util"] }
tokio-util = "0.7"
wasmtime = "47.0.4"
wasmtime-wasi = { version = "47.0.4", features = ["p2"] }
wasmtime-wasi-http = { version = "47.0.4", default-features = false, features = ["p2"] }
oas3 = { version = "0.22.0", default-features = false }
