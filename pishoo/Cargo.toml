[package]
name = "pishoo"
description = "modern, secure, QUIC-powered web/proxy engine"
homepage = "https://www.dhttp.net"
version = "0.8.2"
edition = "2024"
license = "Apache-2.0"
autobins = false

[lib]
path = "src/pishoo.rs"

[dependencies]
ddns = { package = "dyns", git = "https://github.com/genmeta/ddns.git", rev = "27663c4a1c1adf64ed1ea7bb79a63b582a347f9e", features = ["h3", "mdns"] }
qprotocol = { git = "https://github.com/genmeta/dquic.git", rev = "b9af55da49c2e10a6b2004b72a90b0fff81da0ce" }
dhttp = { git = "https://github.com/genmeta/dhttp.git", rev = "03dad9b191a23bf93cdfd4cde9b4b56aed7938de" }
h3x = { git = "https://github.com/genmeta/h3x.git", rev = "d1b475d8ae87da73ae886620ae702c978f75b868" }
dhttp-home = { git = "https://github.com/genmeta/dhttp.git", rev = "03dad9b191a23bf93cdfd4cde9b4b56aed7938de" }
qtls = { git = "https://github.com/genmeta/dquic.git", rev = "b9af55da49c2e10a6b2004b72a90b0fff81da0ce" }
access_control = { git = "https://github.com/genmeta/daccess.git", rev = "3e3ac6199e88f6b5e521e8d29c934ead3bb5db7c" }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio"] }
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
der = "0.7"
sha1 = "0.10"
x509-cert = "0.2"
x509-ocsp = "0.2"
x509-parser = "0.18"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
scopeguard = "1"
tower = { version = "0.5", features = ["util"] }
cap-std = "4"
rustix = { version = "1", features = ["fs"] }
toml = "0.9"
form_urlencoded = "1"
percent-encoding = "2"
mime_guess = "2"
wasmparser = "0.259.0"

bytes = "1"
async-stream = "0.3"
base64 = "0.22"
chrono = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "io-std", "fs", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
wasmtime = "47.0.4"
wasmtime-wasi = { version = "47.0.4", features = ["p2"] }
wasmtime-wasi-http = { version = "47.0.4", default-features = false, features = ["p2"] }
oas3 = { version = "0.22.0", default-features = false }
getrandom = "0.4"
imagesize = { version = "0.14", default-features = false, features = ["jpeg", "png", "webp"] }
include_dir = "0.7"
snafu = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
qbase = { git = "https://github.com/genmeta/dquic.git", rev = "b9af55da49c2e10a6b2004b72a90b0fff81da0ce" }
hyper = { version = "1", features = ["server", "http1"] }
tokio = { version = "1", features = ["test-util"] }
rcgen = "0.14"
wat = "1"

[[bin]]
name = "pishoo"
path = "src/main.rs"

[[example]]
name = "setup-tcp-demo"
path = "tests/support/setup-tcp-demo.rs"

[[example]]
name = "check-lib"
path = "tools/check-lib.rs"

[[example]]
name = "pishoo-client"
path = "examples/client.rs"
