[package]
name = "pishoo"
description = "modern, secure, QUIC-powered web/proxy engine"
homepage = "https://www.dhttp.net"
version = "0.8.2"
edition = "2024"
license = "Apache-2.0"
autobins = false

[features]
tcp-mock = ["dhttp/tcp-mock"]

[lib]
path = "src/pishoo.rs"

[dependencies]
dhttp = { path = "../../dhttp/dhttp" }
dhttp-home = { path = "../../dhttp/home" }
dhttp-identity = { path = "../../dhttp/identity" }
access_control = { path = "../../daccess" }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio"] }
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
scopeguard = "1"
tower = { version = "0.5", features = ["util"] }
cap-std = "4"
percent-encoding = "2"
mime_guess = "2"
wasmparser = "0.259.0"

bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "io-std", "fs", "signal", "process", "net"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
nix = { version = "0.31", features = ["user", "signal", "process"] }
wasmtime = "47.0.4"
wasmtime-wasi = { version = "47.0.4", features = ["p2"] }
wasmtime-wasi-http = { version = "47.0.4", default-features = false, features = ["p2"] }
oas3 = { version = "0.22.0", default-features = false }

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1"] }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
qtls = { path = "../../dquic/qtls" }
rcgen = "0.14"
wat = "1"

[[bin]]
name = "pishoo"
path = "src/main.rs"

[[example]]
name = "setup-tcp-demo"
path = "tests/support/setup-tcp-demo.rs"
required-features = ["tcp-mock"]

[[example]]
name = "check-lib"
path = "tools/check-lib.rs"

[[example]]
name = "pishoo-client"
path = "tests/support/client.rs"
