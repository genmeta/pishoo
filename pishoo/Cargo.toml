[package]
name = "pishoo"
description = "modern, secure, QUIC-powered web/proxy engine"
homepage = "https://www.dhttp.net"
version = "0.8.2"
edition = "2024"
license = "Apache-2.0"
autobins = false

[dependencies]
gateway = { path = "../gateway" }

bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
wasmtime = "47.0.4"
wasmtime-wasi = { version = "47.0.4", features = ["p2"] }
wasmtime-wasi-http = { version = "47.0.4", default-features = false, features = ["p2"] }

[dev-dependencies]
futures = "0.3"
