[package]
name = "workspace"
version = "0.2.0"
edition = "2024"
publish = false
license = "Apache-2.0"
[workspace]
[lib]
path = "src/workspace.rs"
crate-type = ["cdylib"]
[dependencies]
pishoo-sdk = { path = "../../wit" }
wasip2 = "=1.0.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1"
form_urlencoded = "1"
imagesize = "0.14"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
