[package]
name = "journal"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
path = "src/journal.rs"
crate-type = ["cdylib"]

[dependencies]
wasip2 = "=1.0.4"
pishoo-sdk = { version = "=0.1.0-preview.1", path = "../../../wit" }
serde_json = "1"
form_urlencoded = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
base64 = "0.22.1"
imagesize = { version = "0.14", default-features = false, features = ["jpeg"] }
http = "1.5"
